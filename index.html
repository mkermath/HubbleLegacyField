<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crochet Pattern Loom</title>
    <script src="Crochet%20Pattern%20Loom_files/d3.v7.min_iFZE.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #fafafa;
        }
        #three-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
        }
        #loom {
            width: 100%;
            height: 200px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-top: 10px;
            overflow: hidden;
        }
        #loom.expanded {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2000;
            border-radius: 0;
            border: none;
        }
        .input-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            max-width: 400px;
        }
        .input-overlay textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            min-height: 80px;
            font-family: monospace;
        }
        .input-overlay textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-overlay button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
        }
        .input-overlay button:hover {
            opacity: 0.9;
        }
        .expand-btn {
            background: #6c757d;
            margin-top: 5px;
        }
        .expand-btn:hover {
            background: #5a6268;
        }
        .legend-overlay {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .legend-color {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .stitch {
            cursor: pointer;
            transition: all 0.2s;
        }
        .stitch:hover {
            filter: brightness(1.2);
        }
        .yarn-texture {
            filter: url(#yarnFilter);
        }
    </style>
</head>

inant-baseline="middle" fill="#666" font-size="12">6</text><text class="node-number" x="7.041719095097281e-15" y="115" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">7</text><text class="node-number" x="-57.50000000000002" y="99.59292143521043" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">8</text><text class="node-number" x="-99.59292143521043" y="57.50000000000004" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">9</text><text class="node-number" x="-115" y="1.4083438190194563e-14" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">10</text><text class="node-number" x="-99.59292143521043" y="-57.500000000000014" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">11</text><text class="node-number" x="-57.50000000000005" y="-99.59292143521043" text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="12">12</text></g></svg></div>
        <div class="legend-overlay" id="legend"><div class="legend-item"><div class="legend-color" style="background: rgb(255, 107, 107);"></div><span>ch: chain</span></div><div class="legend-item"><div class="legend-color" style="background: rgb(78, 205, 196);"></div><span>sc: single crochet</span></div><div class="legend-item"><div class="legend-color" style="background: rgb(69, 183, 209);"></div><span>dc: double crochet</span></div><div class="legend-item"><div class="legend-color" style="background: rgb(150, 206, 180);"></div><span>tr: treble crochet</span></div><div class="legend-item"><div class="legend-color" style="background: rgb(255, 234, 167);"></div><span>sl: slip stitch</span></div><div class="legend-item"><div class="legend-color" style="background: rgb(221, 160, 221);"></div><span>hdc: half double crochet</span></div></div>
    </div>

    <script>
        const defaultLegend = {
            'ch': { color: '#FF6B6B', name: 'chain' },
            'sc': { color: '#4ECDC4', name: 'single crochet' },
            'dc': { color: '#45B7D1', name: 'double crochet' },
            'tr': { color: '#96CEB4', name: 'treble crochet' },
            'sl': { color: '#FFEAA7', name: 'slip stitch' },
            'hdc': { color: '#DDA0DD', name: 'half double crochet' }
        };

        let currentLegend = { ...defaultLegend };

        function parseLegend(input) {
            const legend = {};
            const lines = input.trim().split('\n');
            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length >= 3) {
                    legend[parts[0].trim()] = {
                        color: parts[1].trim(),
                        name: parts[2].trim()
                    };
                }
            });
            return legend;
        }

        function renderPattern() {
            const patternInput = document.getElementById('patternInput').value;
            const nodeCount = 12;
            const nodeRadius = 20;
            const circleRadius = 80;
            const bgColor = '#ffffff';
            const isExpanded = document.getElementById('loom').classList.contains('expanded');

            // Parse pattern
            const stitches = patternInput.trim().split(/\s+/).filter(s => s);
            
            // Clear previous rendering
            d3.select('#loom').selectAll('*').remove();

            // Get dimensions based on state
            let width, height, scale;
            if (isExpanded) {
                width = window.innerWidth;
                height = window.innerHeight;
                const graphSize = 400 + nodeRadius * 2;
                scale = Math.min(width / graphSize, height / graphSize) * 0.8;
            } else {
                const loomRect = document.getElementById('loom').getBoundingClientRect();
                width = loomRect.width;
                height = loomRect.height;
                const graphSize = circleRadius * 2 + nodeRadius * 2;
                scale = Math.min(width / graphSize, height / graphSize) * 0.9;
            }
            
            // Create SVG
            const svg = d3.select('#loom')
                .append('svg')
                .attr('width', width)
                .attr('height', height)
                .style('background', bgColor);
            
            // Create group for scaling and centering
            const g = svg.append('g')
                .attr('transform', `translate(${width / 2}, ${height / 2}) scale(${scale})`);

            // Create nodes positioned equally around a circle
            const nodes = [];
            for (let i = 0; i < nodeCount; i++) {
                const angle = (i / nodeCount) * 2 * Math.PI - Math.PI / 2;
                const x = circleRadius * Math.cos(angle);
                const y = circleRadius * Math.sin(angle);
                const stitchCode = stitches[i % stitches.length] || 'ch';
                const stitchInfo = currentLegend[stitchCode] || { color: '#cccccc', name: 'unknown' };
                
                nodes.push({
                    index: i,
                    x,
                    y,
                    angle,
                    stitch: stitchCode,
                    color: stitchInfo.color,
                    name: stitchInfo.name
                });
            }

            // Draw connections between adjacent nodes (base ring)
            const connections = [];
            for (let i = 0; i < nodeCount; i++) {
                const nextIndex = (i + 1) % nodeCount;
                connections.push({
                    source: nodes[i],
                    target: nodes[nextIndex]
                });
            }

            // Draw base ring connections
            g.selectAll('.base-connection')
                .data(connections)
                .enter()
                .append('line')
                .attr('class', 'base-connection')
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y)
                .attr('stroke', '#ddd')
                .attr('stroke-width', 2);

            // Draw pattern wrapping path
            const patternPath = [];
            for (let i = 0; i < stitches.length; i++) {
                const nodeIndex = i % nodeCount;
                const nextNodeIndex = (i + 1) % nodeCount;
                patternPath.push({
                    source: nodes[nodeIndex],
                    target: nodes[nextNodeIndex],
                    stitch: stitches[i],
                    color: currentLegend[stitches[i]]?.color || '#cccccc'
                });
            }

            // Draw pattern path with curved lines through center
            g.selectAll('.pattern-path')
                .data(patternPath)
                .enter()
                .append('path')
                .attr('class', 'pattern-path')
                .attr('d', d => {
                    const midX = (d.source.x + d.target.x) / 2;
                    const midY = (d.source.y + d.target.y) / 2;
                    // Curve through center for figure-8 pattern effect
                    const controlX = midX * 0.3;
                    const controlY = midY * 0.3;
                    return `M ${d.source.x} ${d.source.y} Q ${controlX} ${controlY} ${d.target.x} ${d.target.y}`;
                })
                .attr('stroke', d => d.color)
                .attr('stroke-width', 3)
                .attr('fill', 'none')
                .attr('opacity', 0.6)
                .attr('stroke-linecap', 'round');

            // Draw nodes
            g.selectAll('circle')
                .data(nodes)
                .enter()
                .append('circle')
                .attr('class', 'stitch')
                .attr('cx', d => d.x)
                .attr('cy', d => d.y)
                .attr('r', nodeRadius)
                .attr('fill', d => d.color)
                .attr('stroke', '#333')
                .attr('stroke-width', 2)
                .on('mouseover', function(event, d) {
                    d3.select(this)
                        .attr('r', nodeRadius + 5)
                        .attr('stroke-width', 4);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this)
                        .attr('r', nodeRadius)
                        .attr('stroke-width', 2);
                });

            // Draw node labels
            g.selectAll('text')
                .data(nodes)
                .enter()
                .append('text')
                .attr('x', d => d.x)
                .attr('y', d => d.y)
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'middle')
                .attr('fill', d => getContrastColor(d.color))
                .attr('font-size', 14)
                .attr('font-weight', 'bold')
                .text(d => d.stitch);

            // Draw node numbers
            g.selectAll('.node-number')
                .data(nodes)
                .enter()
                .append('text')
                .attr('class', 'node-number')
                .attr('x', d => d.x + (nodeRadius + 15) * Math.cos(d.angle))
                .attr('y', d => d.y + (nodeRadius + 15) * Math.sin(d.angle))
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'middle')
                .attr('fill', '#666')
                .attr('font-size', 12)
                .text(d => d.index + 1);

            // Render legend
            const legendContainer = d3.select('#legend');
            legendContainer.selectAll('*').remove();
            Object.entries(currentLegend).forEach(([code, info]) => {
                const item = legendContainer.append('div')
                    .attr('class', 'legend-item');
                
                item.append('div')
                    .attr('class', 'legend-color')
                    .style('background', info.color);
                
                item.append('span')
                    .text(`${code}: ${info.name}`);
            });
        }

        function getContrastColor(hexcolor) {
            const r = parseInt(hexcolor.slice(1, 3), 16);
            const g = parseInt(hexcolor.slice(3, 5), 16);
            const b = parseInt(hexcolor.slice(5, 7), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#000000' : '#ffffff';
        }

        function toggleExpand() {
            const loom = document.getElementById('loom');
            loom.classList.toggle('expanded');
            const btn = document.querySelector('.expand-btn');
            btn.textContent = loom.classList.contains('expanded') ? 'Collapse Preview' : 'Expand Preview';
            renderPattern();
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            if (document.getElementById('patternInput').value.trim()) {
                renderPattern();
            }
        });

        function update3DFlower() {
            const patternInput = document.getElementById('patternInput').value;
            const stitches = patternInput.trim().split(/\s+/).filter(s => s);
            const layers = parseInt(document.getElementById('iterations').value) || 3;
            
            d3.select('#three-container').selectAll('*').remove();
            
            if (stitches.length === 0) return;
            
            const width = window.innerWidth;
            const height = window.innerHeight;
            const centerX = width / 2;
            const centerY = height / 2;
            const baseKnotSize = Math.min(width, height) * 0.35;
            
            const svg = d3.select('#three-container')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // Add SVG filters for yarn texture
            const defs = svg.append('defs');
            
            // Drop shadow filter for depth
            defs.append('filter')
                .attr('id', 'shadowFilter')
                .append('feDropShadow')
                .attr('dx', '2')
                .attr('dy', '2')
                .attr('stdDeviation', '2')
                .attr('flood-opacity', '0.3');
            
            const g = svg.append('g')
                .attr('transform', `translate(${centerX}, ${centerY})`);
            
            // Create multiple knot layers
            for (let layer = 0; layer < layers; layer++) {
                const layerScale = 1 - (layer * 0.15);
                const layerRotation = layer * (Math.PI / stitches.length);
                const layerOpacity = 1 - (layer * 0.15);
                const knotSize = baseKnotSize * layerScale;
                
                const layerGroup = g.append('g')
                    .attr('transform', `rotate(${layerRotation * 180 / Math.PI})`);
                
                // Create knot path points for this layer
                const knotPoints = [];
                const segments = stitches.length;
                const radius = knotSize;
                
                for (let i = 0; i < segments; i++) {
                    const angle1 = (i / segments) * 2 * Math.PI;
                    const angle2 = ((i + 0.5) / segments) * 2 * Math.PI;
                    const angle3 = ((i + 1) / segments) * 2 * Math.PI;
                    
                    const color = currentLegend[stitches[i]]?.color || '#cccccc';
                    
                    // Outer point
                    knotPoints.push({
                        x: Math.cos(angle1) * radius,
                        y: Math.sin(angle1) * radius,
                        color: color,
                        index: i
                    });
                    
                    // Inner point (creates the weave)
                    knotPoints.push({
                        x: Math.cos(angle2) * radius * 0.5,
                        y: Math.sin(angle2) * radius * 0.5,
                        color: color,
                        index: i
                    });
                }
                
                // Draw knot strands with over/under pattern
                for (let i = 0; i < knotPoints.length; i += 2) {
                    const p1 = knotPoints[i];
                    const p2 = knotPoints[i + 1];
                    const p3 = knotPoints[(i + 2) % knotPoints.length];
                    const p4 = knotPoints[(i + 3) % knotPoints.length];
                    
                    const isOver = (i + layer * 2) % 4 === 0;
                    
                    // Draw the strand
                    const pathData = `M ${p1.x} ${p1.y} Q ${p2.x} ${p2.y} ${p3.x} ${p3.y} T ${p4.x} ${p4.y}`;
                    
                    if (isOver) {
                        // Over strand - draw on top with shadow
                        layerGroup.append('path')
                            .attr('d', pathData)
                            .attr('stroke', p1.color)
                            .attr('stroke-width', 6 - layer * 0.5)
                            .attr('fill', 'none')
                            .attr('stroke-linecap', 'round')
                            .attr('opacity', layerOpacity)
                            .attr('filter', 'url(#shadowFilter)');
                        
                        // Highlight
                        layerGroup.append('path')
                            .attr('d', pathData)
                            .attr('stroke', 'rgba(255,255,255,0.3)')
                            .attr('stroke-width', 2)
                            .attr('fill', 'none')
                            .attr('stroke-linecap', 'round')
                            .attr('opacity', layerOpacity)
                            .attr('transform', 'translate(0, -2)');
                    } else {
                        // Under strand - draw with gaps to show it goes under
                        layerGroup.append('path')
                            .attr('d', pathData)
                            .attr('stroke', p1.color)
                            .attr('stroke-width', 6 - layer * 0.5)
                            .attr('fill', 'none')
                            .attr('stroke-linecap', 'round')
                            .attr('stroke-dasharray', '10, 5')
                            .attr('opacity', layerOpacity * 0.8);
                    }
                }
            }
            
            // Draw center flower knot
            const centerGroup = g.append('g');
            const centerRadius = baseKnotSize * 0.3;
            
            // Create center knot points
            const centerPoints = [];
            for (let i = 0; i < stitches.length; i++) {
                const angle = (i / stitches.length) * 2 * Math.PI;
                centerPoints.push({
                    x: Math.cos(angle) * centerRadius,
                    y: Math.sin(angle) * centerRadius,
                    color: currentLegend[stitches[i]]?.color || '#FFEAA7'
                });
            }
            
            // Draw center knot strands
            for (let i = 0; i < centerPoints.length; i++) {
                const p1 = centerPoints[i];
                const p2 = centerPoints[(i + 1) % centerPoints.length];
                
                centerGroup.append('path')
                    .attr('d', `M ${p1.x} ${p1.y} Q 0 0 ${p2.x} ${p2.y}`)
                    .attr('stroke', '#FFEAA7')
                    .attr('stroke-width', 4)
                    .attr('fill', 'none')
                    .attr('stroke-linecap', 'round')
                    .attr('filter', 'url(#shadowFilter)');
            }
            
            // Center circle
            centerGroup.append('circle')
                .attr('r', 10)
                .attr('fill', '#FFEAA7')
                .attr('stroke', '#333')
                .attr('stroke-width', 2)
                .attr('filter', 'url(#shadowFilter)');
            
            // Add stitch labels only on outermost layer
            const outerRadius = baseKnotSize * 0.75;
            for (let i = 0; i < stitches.length; i++) {
                const angle = (i / stitches.length) * 2 * Math.PI;
                const x = Math.cos(angle) * outerRadius;
                const y = Math.sin(angle) * outerRadius;
                
                g.append('text')
                    .attr('x', x)
                    .attr('y', y + 25)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#333')
                    .attr('font-size', 11)
                    .attr('font-weight', 'bold')
                    .text(stitches[i]);
            }
        }
        
        // Override renderPattern to also update background visualization
        const originalRenderPattern = renderPattern;
        renderPattern = function() {
            originalRenderPattern();
            update3DFlower();
        };
        
        // Initial render
        renderPattern();
